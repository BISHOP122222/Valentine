<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pacifico&display=swap" rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="heart-container">
            <div class="heart"></div>
        </div>
        <h1 id="question">Will you be my Valentine? 💖</h1>
        <p id="subtext">Please say yes! 🥺</p>
        
        <div class="buttons">
            <button id="yes-btn">Yes! 🥰</button>
            <button id="no-btn">No 😢</button>
        </div>

        <div id="hidden-message" class="hidden">
            <h1>Yay!!! I love you so much! ❤️❤️❤️</h1>
            <img src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif" alt="Happy Cat" class="gif">
            <button onclick="location.reload()">Replay Surprise</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
